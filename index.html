<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101114" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DMX Address" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
  <title>DMX Address</title>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>DMX Address</h1>
        <p class="subtitle">Adresseberegner til DMX-armaturer</p>
      </div>
      <button id="resetBtn" class="ghost-btn" aria-label="Nulstil til adresse 1">Reset</button>
    </header>

    <section class="address-card">
      <div class="label">DMX-adresse</div>
      <div id="addressDisplay" class="address">001</div>
      <div id="rangeWarning" class="warning hidden"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <div class="label">DIP-switches</div>
          <div class="hint">Tryk direkte på en switch for at ændre adressen</div>
        </div>
      </div>

      <div class="dip-wrap" id="dipContainer"></div>

      <div class="binary-row">
        <span>Binær</span>
        <strong id="binaryDisplay">000000001</strong>
      </div>
    </section>

    <section class="panel fixture-panel">
      <div>
        <div class="label">Kanaler pr. lampe</div>
        <div class="hint">Bruges til næste / forrige startadresse</div>
      </div>
      <div class="stepper">
        <button id="channelsMinus" aria-label="Færre kanaler">−</button>
        <input id="channelsInput" type="number" min="1" max="512" inputmode="numeric" value="15" />
        <button id="channelsPlus" aria-label="Flere kanaler">+</button>
      </div>
    </section>

    <section class="panel keypad-panel">
      <div class="label">Indtast adresse</div>
      <div id="keypad" class="keypad">
        <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
        <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
        <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
        <button data-key="clear" class="secondary">CLR</button><button data-key="0">0</button><button data-key="back" class="secondary">⌫</button>
      </div>
    </section>

    <section class="nav-buttons">
      <button id="previousBtn" class="nav-btn">
        <span class="nav-symbol">−</span>
        <span>Forrige</span>
      </button>
      <button id="nextBtn" class="nav-btn primary">
        <span class="nav-symbol">+</span>
        <span>Næste</span>
      </button>
    </section>

    <section class="panel presets-panel">
      <div class="panel-head">
        <div>
          <div class="label">Hurtigvalg</div>
          <div class="hint">Typiske kanalantal</div>
        </div>
      </div>
      <div class="presets">
        <button data-ch="4">4 ch</button>
        <button data-ch="8">8 ch</button>
        <button data-ch="12">12 ch</button>
        <button data-ch="15">15 ch</button>
        <button data-ch="16">16 ch</button>
        <button data-ch="24">24 ch</button>
      </div>
    </section>

    <footer>
      Offline • DMX 1–512 • Ingen login
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
